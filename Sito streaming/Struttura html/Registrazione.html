<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BISTREAM - Registrazione</title>
</head>
<body>
    <header>
        <img src="../Img/Logo sito streaming.png" alt="Logo_Bistream" width="120">
        <h1>BISTREAM</h1>
        <nav>
            <ul>
                <li><a href="./Homepage.html">Homepage</a></li>
                <li><a href="./Serietv.html">Serietv</a></li>
                <li><a href="./Film.html">Film</a></li>
                <li><a href="./Account.html">Account</a></li>
                <li><a href="./Coda.html">Coda</a></li>
                <li><a href="./Abbonamento.html">Abbonamento</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Registrati qui</h2>
            <form action="./Homepage.html" method="post">

                <p>
                    <label for="username">Nome Utente:</label><br>
                    <input type="text" id="username" name="username" placeholder="Inserisci il nome utente" required>
                </p>

                <p>
                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" placeholder="Inserisci la tua e-mail" required>
                </p>

                <p>
                    <label for="password">Password:</label><br>
                    <input type="password" id="password" name="password" placeholder="Inserisci la password" required>
                </p>

                <p>
                    <label for="sesso">Sesso:</label><br>
                    <select id="sesso" name="Sesso" required>
                        <option value="" disabled selected>Seleziona un'opzione</option>
                        <option value="Maschio">Maschio</option>
                        <option value="Femmina">Femmina</option>
                        <option value="Preferisco non specificarlo">Preferisco non specificarlo</option>
                    </select>
                </p>

                <p>
                    <label for="profilo">Profilo:</label><br>
                    <select id="profilo" name="Profilo" required>
                        <option value="" disabled selected>Seleziona il tipo di profilo</option>
                        <option value="Bambino">Bambino</option>
                        <option value="Adulto">Adulto (16+)</option>
                    </select>
                </p>

                <p>
                    <label for="eta">Età:</label><br>
                    <input type="number" id="eta" name="eta" placeholder="Età" min="1" max="100" required>
                </p>

                <br>
                <input type="submit" name="Registrati" value="Registrati">
                <input type="reset" name="Reset" value="Reset">
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Emanuele Ippoliti - tutti i diritti riservati</p>
    </footer>
</body>
</html>
