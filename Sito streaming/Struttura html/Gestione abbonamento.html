            <h2>Info per disdetta abbonamento</h2>
            
            <form action="./Homepage.html" method="post">

                <textarea id="motivazione" rows="5" cols="40" placeholder="Scrivi la motivazione della tua disdetta" name="Info_disdetta" required></textarea>
                
                <p><label for="recensione">Ora dicci la tua esperienza così puoi aiutarci a crescere:</label></p>
                <textarea id="recensione" rows="5" cols="40" placeholder="Scrivi la tua recensione" name="Recensione"></textarea>
                
                <br><br>

                <input type="submit" name="Invia_disdetta" value="Invia">
                <input type="reset" value="Reset">
