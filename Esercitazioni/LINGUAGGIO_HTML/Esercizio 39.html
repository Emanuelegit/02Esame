<!DOCTYPE html>
<html lang="it">
    
<head>
      <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizio 39</title>
</head>
<body>
    <h1>Titolo per esercizio 39</h1>
    <form action="http://www.example.com/subscribe.php" method="post">
        <p>
            <label for="Nome">Nome :</label>
            <input type="text" id="Nome" name="Nome" required>
        </p>
        <p>
            <label for="Cognome">Cognome :</label>
            <input type="text" id="Cognome" name="Cognome" required>
        </p>
        <p>
            <label for="Codice fiscale">CF :</label>
            <input type="text" id="Codice fiscale" name="Codice fiscale" maxlength="16" 
                   pattern="^[A-Z]{6}[0-9]{2}[A-Z]{1}[0-9]{2}[A-Z]{1}[0-9]{3}[A-Z]{1}$" required minlength="16">
        </p>
        <p> 
            <label for="Genere">Genere : </label>
            <input type="radio" name="genere" value="Maschio" checked="checked" required/>Maschio
            <input type="radio" name="genere" value="Femmina" required/>Femmina
        </p>
        <p> 
            <label for="Data di nascita">Data di nascita :</label>
            <input type="date" id="Data di nascita" name="Data di nascita" required>
        </p>
        <p> 
            <label for="Luogo di nascita">Luogo di nascita :</label>
            <input type="text" id="Luogo di nascita" name="Luogo di nascita" required>
        </p>
        <p>Inserisci la tua residenza. </p>
        <p> 
            <label for="(Via, Piazza, Civico)">(Via, Piazza, Civico) :</label>
            <input type="text" id="(Via, Piazza, Civico)" name="(Via, Piazza, Civico)" autocomplete="street-address" required>
            <label for="Città">Città :</label>
            <input type="text" id="Città" name="Città" autocomplete="address-level2" required>
            <label for="CAP">CAP :</label>
            <input type="text" id="CAP" name="CAP" autocomplete="postal-code" required>
        </p>
        <p> 
            <label for="Recapito cellulare">Recapito cellulare :</label>
            <input type="tel" id="Recapito cellulare" name="Recapito cellulare" required>
        </p>
        <p>
            <textarea rows="10" cols="50" placeholder="Inserisci qui i dati interni" required></textarea>
        </p>
        <input type="submit" name="submit" value="invia"/>
        <input type="reset" name="reset" value="reset"/>
    </form>
    
</body>
</html>
