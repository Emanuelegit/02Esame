        <h1>Titolo principale</h1>
        <p>Di seguito troverete una citazione di un grande filosofo latino Lucio Anneo Seneca! </p>
        <q>Vita, si uti scias, longa est.</q> 
        <p>Questa frase significa "La vita, se sai come usarla, è lunga"</p>
