<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easercizio CSS n°10</title>
    <style>
        *{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        h1{
            border: double 10px lightslategrey;
            width: fit-content;
        }
        dd.traduzione {

            border-bottom: 2px dotted #ccc;
            
            width: 300px
        }
        dl.parola {
            border: 10px solid purple;
        }
    </style>
</head>
<body>
    <h1>Vocabolario da Italiano a Inglese</h1>
    <dl class="parola">Tappeto
        <dd class="traduzione">Carpet</dd>
    </dl>
    <dl class="parola">Lenzuola
        <dd class="traduzione">Sheets</dd>
    </dl>
    
    <dl class="parola">Sdraio
        <dd class="traduzione">Deckchair</dd>
    </dl>
    
    <dl class="parola">Ombrellone
        <dd class="traduzione">Beach umbrella</dd>
    </dl>
</body>
</html>
