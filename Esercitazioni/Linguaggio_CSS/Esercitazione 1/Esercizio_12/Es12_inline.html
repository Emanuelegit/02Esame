<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Es CSS n°12</title>
</head>
<body style="background-color: antiquewhite;">
    <h1 style="text-align: center;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    font-weight: bolder;">SECONDA LEZIONE DI HTML</h1>
        <p style="text-align: center;
    border: 6px solid black;
    width: fit-content;">Oggi vedremo la differenza tra il tag &lt;sub&gt; e &lt;sup&gt;</p>
        <br>
        <p style="text-align: center;
    border: 6px solid black;
    width: fit-content;">Con il primo tag sup andremo ad inserire degli <sup style="background-color: yellow;
    font-weight: bold;">Apici</sup></p>
        <p style="text-align: center;
    border: 6px solid black;
    width: fit-content;">Con il secondo tag sub andremo ad inserire dei <sub style="background-color: yellow;
    font-weight: bold;">Pedici</sub></p>
</body>
