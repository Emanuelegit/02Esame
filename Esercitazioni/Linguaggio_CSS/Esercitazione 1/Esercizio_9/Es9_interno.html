<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Es CSS n°9</title>
    <style>
        
body {
    background-color: rgb(14, 159, 14);
}

div.contenitore {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}


h1 {
    background-color: red;
    font-weight: bolder;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    width: fit-content;
    border: 8px solid yellow;
    text-align: center;
}

p {
    font-weight: bold;
    text-align: center;
    color: blue;
}

p>strong {
    border: 10px solid;
    width: fit-content;
    color: red;
}
    </style>
</head>
<body>
    <h1>Marcare parole o testi</h1>
        <p>Quando si prende la patente è molto importante <strong>DARE LA PRECEDENZA</strong> ai pedoni perchè sennò si rischia di <mark> INVESTIRLI </mark></p>
</body>
</html>
