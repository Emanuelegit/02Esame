<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ess CSS n°4</title>
    
</head>
<body>
    <h1 style="background-color: green;
    padding: 10px;
    text-align: center;
    padding: 25px;
    border-radius: 10px;">Titolo principale</h1>
        <p style="p {
    text-align: center;
    border: 10px solid #999;
    border-radius: 10px;
    margin: 0px 10px 30px 10px;
    font-family: Georgia, 'Times New Roman', Times, serif;
    
}">Di seguito troverete una citazione di un grande filosofo latino Lucio Anneo Seneca! </p>
       <div class="contenitore" style="width: fit-content;
    display: flex;
    justify-content: center;
    text-align: center;
    font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
    padding: 20px;
    border: 2px solid #456245;
    margin: 20px auto;">
        <q>Vita, si uti scias, longa est.</q>
       </div> 
         
        <p class="secondo" style="p.secondo {
    text-align: left;
    font-family: 'Courier New', Courier, monospace;
    font-size: 20px;
    border: red solid;
    margin-top: 30px;
}">Questa frase significa "La vita, se sai come usarla, è lunga"</p> 
</body>
</html>
