    <title>Esercizio CSS n°11</title>
    <style>
        
        *{
            box-sizing: border-box;
            font-family:Verdana, Geneva, Tahoma, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
        } 
        
        div.contenitore1 ul {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgb(14, 31, 55);
            padding: 10px 25px; 
            gap: 100px;          
            
            margin: 0;
            padding-left: 25px; 
            padding-right: 25px;
            list-style: none;
        }

        li img {
            list-style: none;
        }

        a {
            color: rgb(183, 195, 210);

            font-weight: 600;
            transition: color 0.2s ease;

        a:active {
            color: purple;
        }
        a:hover {
            color: #ffffff;
        }

        li.sinistra, li.destra {
            list-style: none;
        }
